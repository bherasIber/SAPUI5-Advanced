specVersion: "3.1"
metadata:
  name: logaligroup.employees
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /v2
            url: https://services.odata.org
            destination: Northwind
          - path: /sap/opu/odata/sap/YSAPUI5_SRV_01/
            url: http://erp13.sap4practice.com:9037
            client: "001"
          - path: /v2/Northwind/Northwind.svc/
            url: https://services.odata.org/
            destination: Northwind
            authenticationType: NoAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
        excludePatterns:
          - /Component-preload.js
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /v2/Northwind/Northwind.svc
            generateMockData: true
            metadataXmlPath: ./webapp/localService/Northwind/metadata.xml
            mockdataRootPath: ./webapp/localService/Northwind/data
          - urlPath: /sap/opu/odata/sap/YSAPUI5_SRV_01/
            generateMockData: true
            metadataXmlPath: ./webapp/localService/YSAPUI5_SRV_01/metadata.xml
            mockdataRootPath: ./webapp/localService/YSAPUI5_SRV_01/mockdata
          - urlPath: /v2/Northwind/Northwind.svc/
            metadataPath: ./webapp/localService/Northwind/metadata.xml
            mockdataPath: ./webapp/localService/Northwind/mockdata
            generateMockData: true
        annotations: []
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
